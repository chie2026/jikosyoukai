<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別面談のご案内</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #0d1a33;
    color: #fff;
    min-height: 100vh;
  }

  .page-wrapper {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .page-header .label {
    display: inline-block;
    background: #C9A84C;
    color: #1A2744;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 10px 32px;
    border-radius: 2px;
  }

  .video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 8px;
    border: 2px solid #C9A84C44;
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 6px;
    display: block;
  }

  .progress-bar-wrapper {
    margin: 10px 0 0;
    height: 4px;
    background: #1A2744;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C9A84C, #f0d080);
    border-radius: 2px;
    transition: width 1s linear;
  }

  #form-section {
    display: none;
    text-align: center;
    margin-top: 32px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #form-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .line-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #06C755;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    padding: 18px 40px;
    border-radius: 50px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px #06C75555;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
    max-width: 480px;
  }
  .line-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px #06C75577;
  }
  .line-btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="page-wrapper">

  <div class="page-header">
    <div class="label">期間限定 特別動画</div>
  </div>

  <div class="video-container">
    <iframe
      id="vimeo-player"
      src="https://player.vimeo.com/video/1216057778?badge=0&autopause=0&player_id=0&app_id=58479"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      frameborder="0">
    </iframe>
  </div>

  <div class="progress-bar-wrapper">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="form-section">
    <a
      href="https://xadeic09.autosns.app/addfriend/s/YOSMN2pgVk/@616saops"
      class="line-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      今すぐ個別面談に申し込む
    </a>
  </div>

</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
var SHOW_AT_SECONDS = 4440; // 1時間14分0秒

var iframe = document.getElementById('vimeo-player');
var player = new Vimeo.Player(iframe);
var formShown = false;
var checkInterval = null;

player.ready().then(function() {
  player.on('play', function() {
    if (!checkInterval) {
      checkInterval = setInterval(checkTime, 2000);
    }
  });
  player.on('pause', function() {
    clearInterval(checkInterval);
    checkInterval = null;
  });
});

function checkTime() {
  player.getCurrentTime().then(function(current) {
    player.getDuration().then(function(total) {
      var pct = Math.min((current / total) * 100, 100);
      document.getElementById('progress-fill').style.width = pct + '%';

      if (!formShown && current >= SHOW_AT_SECONDS) {
        showForm();
      }
    });
  });
}

function showForm() {
  formShown = true;
  var form = document.getElementById('form-section');
  form.style.display = 'block';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      form.classList.add('visible');
    });
  });
  setTimeout(function() {
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}
</script>

</body>
</html>
