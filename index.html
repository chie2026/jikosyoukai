<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別面談のご案内</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #0d1a33;
    color: #fff;
    min-height: 100vh;
  }

  .page-wrapper {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .page-header .label {
    display: inline-block;
    background: #C9A84C;
    color: #1A2744;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 4px 16px;
    border-radius: 2px;
    margin-bottom: 12px;
  }
  .page-header h1 {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
  }
  .page-header h1 span { color: #C9A84C; }

  /* 動画エリア: overflow:hidden を外し、border-radiusはiframe側に */
  .video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 8px;
    border: 2px solid #C9A84C44;
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 6px;
    display: block;
  }

  .progress-bar-wrapper {
    margin: 10px 0 0;
    height: 4px;
    background: #1A2744;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C9A84C, #f0d080);
    border-radius: 2px;
    transition: width 1s linear;
  }

  #form-section {
    display: none;
    margin-top: 40px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #form-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .form-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .form-header .line-icon {
    width: 56px;
    height: 56px;
    background: #06C755;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 28px;
  }
  .form-header h2 {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .form-header h2 span { color: #C9A84C; }
  .form-header p {
    font-size: 14px;
    color: #aab4cc;
    line-height: 1.7;
  }

  .benefits {
    background: #1A2744;
    border: 1px solid #C9A84C55;
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 28px;
  }
  .benefits-title {
    font-size: 13px;
    color: #C9A84C;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .benefits ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .benefits ul li {
    font-size: 14px;
    color: #dde4f0;
    padding-left: 20px;
    position: relative;
    line-height: 1.6;
  }
  .benefits ul li::before {
    content: '✦';
    color: #C9A84C;
    position: absolute;
    left: 0;
    font-size: 10px;
    top: 3px;
  }

  .line-btn-wrapper { text-align: center; }
  .line-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #06C755;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    padding: 18px 40px;
    border-radius: 50px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px #06C75555;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
    max-width: 480px;
  }
  .line-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px #06C75577;
  }
  .line-btn:active { transform: scale(0.98); }
  .line-btn .btn-sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  .line-btn-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .note {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #7a8aaa;
    line-height: 1.6;
  }

  .page-footer {
    text-align: center;
    margin-top: 60px;
    font-size: 12px;
    color: #4a5a7a;
  }
</style>
</head>
<body>

<div class="page-wrapper">

  <div class="page-header">
    <div class="label">期間限定 特別動画</div>
    <h1>あなたの自己紹介を<br><span>売れる自己紹介</span>に変える方法</h1>
  </div>

  <div class="video-container">
    <iframe
      id="yt-player"
      src="https://www.youtube-nocookie.com/embed/5JStE50mFMg?enablejsapi=1&rel=0&modestbranding=1&playsinline=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen
      frameborder="0">
    </iframe>
  </div>

  <div class="progress-bar-wrapper">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="coming-soon-notice" style="display:none;"></div>

  <div id="form-section" style="text-align:center; margin-top:32px;">
    <a
      href="https://xadeic09.autosns.app/addfriend/s/YOSMN2pgVk/@616saops"
      class="line-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      今すぐ個別面談に申し込む
    </a>
  </div>

</div>

<script>
var SHOW_AT_SECONDS = 1410;
var TOTAL_SECONDS   = 1500;

// YouTube IFrame API 読み込み
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
var checkInterval;
var formShown = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt-player', {
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerReady(event) {
  // 準備完了
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    if (!checkInterval) {
      checkInterval = setInterval(checkTime, 2000);
    }
  }
}

function checkTime() {
  if (!player || typeof player.getCurrentTime !== 'function') return;
  var current = player.getCurrentTime();
  var total   = player.getDuration() || TOTAL_SECONDS;

  var pct = Math.min((current / total) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  if (!formShown && current >= SHOW_AT_SECONDS) {
    showForm();
  }
}

function showForm() {
  formShown = true;
  var form = document.getElementById('form-section');
  form.style.display = 'block';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      form.classList.add('visible');
    });
  });
  setTimeout(function() {
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}
</script>

</body>
</html>
