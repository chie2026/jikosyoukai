<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #0d1a33;
    color: #fff;
    min-height: 100vh;
  }

  .page-wrapper {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .page-header .label {
    display: inline-block;
    background: #C9A84C;
    color: #1A2744;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 4px 16px;
    border-radius: 2px;
    margin-bottom: 12px;
  }
  .page-header h1 {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
  }
  .page-header h1 span { color: #C9A84C; }

  /* 動画エリア: overflow:hidden を外し、border-radiusはiframe側に */
  .video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 8px;
    border: 2px solid #C9A84C44;
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 6px;
    display: block;
  }

  .progress-bar-wrapper {
    margin: 10px 0 0;
    height: 4px;
    background: #1A2744;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C9A84C, #f0d080);
    border-radius: 2px;
    transition: width 1s linear;
  }

  #form-section {
    display: none;
    margin-top: 40px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #form-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .form-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .form-header .line-icon {
    width: 56px;
    height: 56px;
    background: #06C755;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 28px;
  }
  .form-header h2 {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .form-header h2 span { color: #C9A84C; }
  .form-header p {
    font-size: 14px;
    color: #aab4cc;
    line-height: 1.7;
  }

  .benefits {
    background: #1A2744;
    border: 1px solid #C9A84C55;
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 28px;
  }
  .benefits-title {
    font-size: 13px;
    color: #C9A84C;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .benefits ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .benefits ul li {
    font-size: 14px;
    color: #dde4f0;
    padding-left: 20px;
    position: relative;
    line-height: 1.6;
  }
  .benefits ul li::before {
    content: '✦';
    color: #C9A84C;
    position: absolute;
    left: 0;
    font-size: 10px;
    top: 3px;
  }

  .line-btn-wrapper { text-align: center; }
  .line-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #06C755;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    padding: 18px 40px;
    border-radius: 50px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px #06C75555;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
    max-width: 480px;
  }
  .line-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px #06C75577;
  }
  .line-btn:active { transform: scale(0.98); }
  .line-btn .btn-sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  .line-btn-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .note {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #7a8aaa;
    line-height: 1.6;
  }

  .page-footer {

    margin-top: 60px;
    font-size: 12px;
    color: #4a5a7a;
  }
</style>

          <rect width="48" height="48" rx="12" fill="#fff" fill-opacity="0.2"/>
          <path d="M40 22.3C40 15.5 33.3 10 25 10S10 15.5 10 22.3c0 6.1 5.4 11.2 12.7 12.2.5.1 1.2.3 1.3.8.1.4 0 1.1 0 1.1s-.2 1.1-.2 1.3c-.1.4-.4 1.5 1.3.8s9.1-5.4 12.5-9.2C39.2 27 40 24.7 40 22.3z" fill="white"/>
          <path d="M35 20.5h-4.5v-2H35a.5.5 0 000-1h-5a.5.5 0 00-.5.5v6a.5.5 0 00.5.5h5a.5.5 0 000-1h-4.5v-2H35a.5.5 0 000-1zM27 24a.5.5 0 01-.5.5h-5a.5.5 0 01-.5-.5v-6a.5.5 0 011 0v5.5h4.5a.5.5 0 01.5.5zM19 18a.5.5 0 00-1 0v6a.5.5 0 001 0v-6zm-2.5 6h-4v-5.5a.5.5 0 00-1 0v6c0 .28.22.5.5.5h4.5a.5.5 0 000-1z" fill="#06C755"/>

<script>
var SHOW_AT_SECONDS = 1410;
var TOTAL_SECONDS   = 1500;

// YouTube IFrame API 読み込み
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
var checkInterval;
var formShown = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt-player', {
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerReady(event) {
  // 準備完了
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    if (!checkInterval) {
      checkInterval = setInterval(checkTime, 2000);
    }
  }
}

function checkTime() {
  if (!player || typeof player.getCurrentTime !== 'function') return;
  var current = player.getCurrentTime();
  var total   = player.getDuration() || TOTAL_SECONDS;

  var pct = Math.min((current / total) * 100, 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  if (!formShown && current >= SHOW_AT_SECONDS) {
    showForm();
  }
}

function showForm() {
  formShown = true;
  var form = document.getElementById('form-section');
  form.style.display = 'block';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      form.classList.add('visible');
    });
  });
  setTimeout(function() {
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}
</script>
